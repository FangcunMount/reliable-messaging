x-rabbitmq: &rabbitmq
  image: rabbitmq:4.3-management@sha256:ddc75301edf58a8332934cf2d801be7cbf8d65c6458d747364a8046238ff1c89
  user: rabbitmq
  environment: &environment
    RABBITMQ_DEFAULT_USER: rmtest
    RABBITMQ_DEFAULT_PASS: rmtest
    RABBITMQ_ERLANG_COOKIE: isolated-quorum-proof-only-cookie
  healthcheck:
    test: [CMD, rabbitmq-diagnostics, -q, ping]
    interval: 2s
    timeout: 5s
    retries: 90

services:
  rabbitmq1:
    <<: *rabbitmq
    hostname: rabbitmq1
    environment:
      <<: *environment
      RABBITMQ_NODENAME: rabbit@rabbitmq1
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq
      - ./quorum-rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  rabbitmq2:
    <<: *rabbitmq
    hostname: rabbitmq2
    environment:
      <<: *environment
      RABBITMQ_NODENAME: rabbit@rabbitmq2
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
      - ./quorum-rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  rabbitmq3:
    <<: *rabbitmq
    hostname: rabbitmq3
    environment:
      <<: *environment
      RABBITMQ_NODENAME: rabbit@rabbitmq3
    volumes:
      - rabbitmq3-data:/var/lib/rabbitmq
      - ./quorum-rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  nsqd:
    image: nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a
    command: [/nsqd, --data-path=/data, --broadcast-address=nsqd, --mem-queue-size=3000, --sync-every=2500, --sync-timeout=2s]
    volumes:
      - nsq-data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:4151/ping | grep -qx OK"]
      interval: 2s
      timeout: 5s
      retries: 60

networks:
  default:
    internal: true

volumes:
  rabbitmq1-data: {}
  rabbitmq2-data: {}
  rabbitmq3-data: {}
  nsq-data: {}
