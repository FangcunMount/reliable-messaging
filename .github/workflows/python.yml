name: Python messaging SDK
on:
  push:
    branches: [main, codex/m7-python-sdk, codex/ai-mq-sdk, codex/ai-mq-ack-budget]
    paths: ['python/**', 'contracts/**', 'wire/protected/**', 'wire/legacy/**', 'delivery/mysql/**', 'tests/integration/protectedprobe/**', 'go.mod', 'go.sum', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', 'contracts/**', 'wire/protected/**', 'wire/legacy/**', 'delivery/mysql/**', 'tests/integration/protectedprobe/**', 'go.mod', 'go.sum', '.github/workflows/python.yml']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            mysql: '8.0.36'
            go: '1.25.9'
          - python: '3.13'
            mysql: '8.4'
            go: '1.25.12'
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: rm_m7
          MYSQL_USER: m7
          MYSQL_PASSWORD: m7_disposable_only
          MYSQL_ROOT_PASSWORD: m7_root_disposable_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pm7_root_disposable_only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    defaults:
      run:
        working-directory: python
    env:
      TZ: Asia/Shanghai
      GOTOOLCHAIN: local
      RM_M7_MYSQL_URL: mysql+asyncmy://m7:m7_disposable_only@127.0.0.1:3306/rm_m7
      RM_MQ_DURABLE_TEST_DSN: 'm7:m7_disposable_only@tcp(127.0.0.1:3306)/rm_m7?parseTime=true'
      RM_MQ_NSQ_TCP: 127.0.0.1:4150
      RM_MQ_NSQ_HTTP: http://127.0.0.1:4151
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify persistent final ACK budgets in the new Go adapter
        working-directory: .
        run: |
          go test -count=1 -race -tags=integration -json ./delivery/mysql > python/ack-budget-go.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(r) for r in Path('python/ack-budget-go.json').read_text().splitlines()]
          passed = {r['Test'] for r in rows if r['Action'] == 'pass' and 'Test' in r}
          required = {'TestMQSuccessfulAckReplaysPreserveFailureBudgetAndOriginalWire', 'TestMQHeldAckCannotBeRearmedByCommittedDuplicate'}
          if not required <= passed or any(r['Action'] in ('fail', 'build-fail', 'skip') for r in rows):
              raise SystemExit('Required final ACK storage tests did not pass')
          PY
      - name: Start dedicated NSQ with the production message-size limit
        run: >-
          docker run --detach --name rm-python-mq-nsq --memory=128m --cpus=1
          --tmpfs /data:rw,size=64m -p 127.0.0.1:4150:4150 -p 127.0.0.1:4151:4151
          nsqio/nsq:v1.3.0 /nsqd --data-path=/data --broadcast-address=127.0.0.1
          --max-msg-size=262144 --mem-queue-size=3000 --sync-every=2500 --sync-timeout=2s
      - run: uv sync --locked --extra nsq
      - run: uv run --locked --extra nsq ruff check src tests
      - run: uv run --locked --extra nsq ruff format --check src tests
      - run: uv run --locked --extra nsq mypy src
      - name: Contract, NSQ lifecycle, original transaction and process recovery
        run: uv run --locked --extra nsq pytest -q --junitxml=results.xml
      - name: Require nonempty acceptance with no skipped cases
        run: |
          uv run --locked --extra nsq python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('results.xml').getroot()
          suites = list(root.iter('testsuite'))
          cases = list(root.iter('testcase'))
          if not suites or not cases or sum(int(s.get('tests', 0)) for s in suites) <= 0:
              raise SystemExit('Required acceptance report is empty')
          if any(int(s.get(k, 0)) != 0 for s in suites for k in ('skipped', 'errors', 'failures')):
              raise SystemExit('Required acceptance contains skipped or failed cases')
          if any(list(root.iter(k)) for k in ('skipped', 'error', 'failure')):
              raise SystemExit('Required acceptance contains unsuccessful test cases')
          required = {'test_successful_final_ack_replays_do_not_spend_failure_budget', 'test_final_ack_hold_survives_duplicate_without_new_budget'}
          if not required <= {c.get('name') for c in cases}:
              raise SystemExit('Required final ACK budget acceptance is absent')
          PY
      - run: uv build
      - name: Verify installed wheel independently of the source tree
        run: |
          uv venv .wheel-smoke
          task_wheels=(dist/*.whl)
          test "${#task_wheels[@]}" -eq 1
          uv pip install --python .wheel-smoke/bin/python "${task_wheels[0]}[nsq]"
          .wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import reliable_messaging
          assert version('fangcun-reliable-messaging') == '0.2.0a2'
          assert (Path(reliable_messaging.__file__).parent / 'py.typed').is_file()
          from reliable_messaging.nsq import NSQPublisher
          from reliable_messaging.protected import Context
          assert NSQPublisher('127.0.0.1:4150')._client is None
          PY
      - name: Run required acceptance against the installed wheel
        run: |
          uv pip install --python .wheel-smoke/bin/python pytest==9.1.1 pytest-asyncio==1.4.0 asyncmy==0.2.14
          .wheel-smoke/bin/python -m pytest -q --junitxml=wheel-results.xml
          .wheel-smoke/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('wheel-results.xml').getroot()
          cases = list(root.iter('testcase'))
          if not cases or any(list(root.iter(k)) for k in ('skipped', 'error', 'failure')):
              raise SystemExit('Required installed-wheel acceptance is empty or unsuccessful')
          required = {'test_successful_final_ack_replays_do_not_spend_failure_budget', 'test_final_ack_hold_survives_duplicate_without_new_budget'}
          if not required <= {c.get('name') for c in cases}:
              raise SystemExit('Required installed-wheel final ACK budget acceptance is absent')
          PY
      - name: Bind candidate assets to their exact source
        run: |
          uv run --locked --extra nsq python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          assets = sorted([*Path('dist').glob('*.whl'), *Path('dist').glob('*.tar.gz')])
          if len(assets) != 2:
              raise SystemExit('Expected one wheel and one source archive')
          review = {'source': os.environ['GITHUB_SHA'], 'formally_published': False,
                    'assets': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in assets}}
          Path('artifact-review.json').write_text(json.dumps(review, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}-mysql-${{ matrix.mysql }}
          path: |
            python/results.xml
            python/wheel-results.xml
            python/ack-budget-go.json
            python/dist/*
            python/artifact-review.json
          if-no-files-found: error
      - name: Remove only this job's disposable NSQ
        if: always()
        run: docker rm -f rm-python-mq-nsq
